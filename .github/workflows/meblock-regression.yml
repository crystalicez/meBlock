name: meBlock regression tooling

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/meblock-regression.yml"
      - "tools/meblock/**"
      - "docs/meblock-comparison.md"
  pull_request:
    paths:
      - ".github/workflows/meblock-regression.yml"
      - "tools/meblock/**"
      - "docs/meblock-comparison.md"
  workflow_dispatch:
    inputs:
      firefox_integration:
        description: "Run the real Firefox integration comparison (slower)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  harness-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install benchmark dependencies
        run: python -m pip install "selenium>=4.30,<5" "psutil>=6,<9"
      - name: Guard public repository artifacts
        run: python tools/meblock/check_public_artifacts.py
      - name: Unit regression tests
        run: python -m unittest discover -s tools/meblock -p "test_*.py" -v
      - name: Test-only browser probe syntax
        run: |
          node --check tools/meblock/browser_probe.js
          node --check tools/meblock/state_probe.js
      - name: Generate deterministic request corpus
        run: python tools/meblock/filtering_benchmark.py synthetic --count 1000 --seed 20261018 --out dist/build/ci-requests.json

  firefox-integration:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.firefox_integration }}
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install benchmark dependencies
        run: python -m pip install "selenium>=4.30,<5" "psutil>=6,<9"
      - name: Resolve Firefox
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files\Mozilla Firefox\firefox.exe')) {
            choco install firefox -y --no-progress
          }
          if (-not (Test-Path 'C:\Program Files\Mozilla Firefox\firefox.exe')) {
            throw 'Firefox binary could not be found or installed'
          }
      - name: Fetch exact original upstream source
        shell: pwsh
        run: |
          git remote add upstream https://github.com/gorhill/uBlock.git
          git fetch --no-tags --depth=1 upstream master
          git rev-parse upstream/master
      - name: Fetch uBlock filter assets
        shell: pwsh
        run: |
          & 'C:\Program Files\Git\bin\bash.exe' -lc 'bash tools/pull-assets.sh'
          if ($LASTEXITCODE -ne 0) { throw 'uAssets checkout failed' }
      - name: Generate isolated Firefox corpus
        run: python tools/meblock/filtering_benchmark.py synthetic --count 1500 --seed 20261018 --out dist/build/ci-browser-requests.json
      - name: Compare real Firefox builds
        run: python tools/meblock/compare_original.py --dataset dist/build/ci-browser-requests.json --runs 1 --timeout 180
      # Raw diagnostic reports may contain URLs, extension details, and private
      # paths. Never publish them as GitHub Actions artifacts in a public repo.
